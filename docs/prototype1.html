<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f9fa">
<meta name="description" content="Esencia Técnica - E.E.S.T N°1 Luciano Reyes | Prototipo SPA compilado (e-commerce escolar)">
<title>Esencia Técnica - SPA Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#154212;
  --on-primary:#ffffff;
  --primary-container:#2d5a27;
  --on-primary-container:#9dd090;
  --secondary:#4c6700;
  --on-secondary:#ffffff;
  --secondary-container:#c9f16f;
  --on-secondary-container:#516d00;
  --error:#ba1a1a;
  --on-error:#ffffff;
  --error-container:#ffdad6;
  --on-error-container:#93000a;
  --background:#f8f9fa;
  --on-background:#191c1d;
  --surface:#f8f9fa;
  --on-surface:#191c1d;
  --surface-variant:#e1e3e4;
  --on-surface-variant:#42493e;
  --surface-container-lowest:#ffffff;
  --surface-container-low:#f3f4f5;
  --surface-container:#edeeef;
  --surface-container-high:#e7e8e9;
  --surface-container-highest:#e1e3e4;
  --outline:#72796e;
  --outline-variant:#c2c9bb;
  --radius-lg:18px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--secondary-container);color:var(--on-secondary-container)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.font-headline{font-family:'Poppins',sans-serif}
.font-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;line-height:1.2}

.mi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;display:inline-block;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;-webkit-font-smoothing:antialiased;user-select:none;vertical-align:middle}
.mi.filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

.container{max-width:1280px;margin:0 auto;padding:0 24px}
.glass-panel{background:rgba(255,255,255,.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:.5px solid rgba(0,0,0,.08)}
.glass-modal{background:rgba(255,255,255,.9);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);box-shadow:0 10px 25px -5px rgba(0,0,0,.05)}
.animate-in{animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.float-badge{animation:bounce 2.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-variant);border-radius:9999px}
::-webkit-scrollbar-thumb:hover{background:var(--outline-variant)}

/* ===== Public Layout ===== */
.topnav{position:sticky;top:0;z-index:50;width:100%;background:rgba(248,249,250,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(194,201,187,.2);box-shadow:0 1px 3px rgba(0,0,0,.03)}
.topnav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-align:left}
.logo-icon{width:32px;height:32px;border-radius:8px;background:rgba(21,66,18,.10);color:var(--primary);display:flex;align-items:center;justify-content:center;border:1px solid rgba(21,66,18,.2);flex-shrink:0}
.logo-text{display:flex;flex-direction:column;min-width:0}
.logo-name{font-family:'Poppins';font-weight:700;color:var(--primary);font-size:1.125rem;line-height:1;white-space:nowrap}
.logo-sub{font-size:9px;color:var(--on-surface-variant);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;font-weight:500;white-space:nowrap}
.pillnav{display:none;align-items:center;gap:2px;background:rgba(237,238,239,.5);padding:4px;border-radius:999px;border:1px solid rgba(194,201,187,.3);font-size:14px;font-weight:500}
.pillnav .pill{padding:9px 20px;border-radius:999px;color:var(--on-surface-variant);transition:all .2s}
.pillnav .pill:hover{color:var(--on-surface)}
.pillnav .pill.active{background:var(--primary);color:var(--on-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.nav-actions{display:flex;align-items:center;gap:12px}
.cart-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);border-radius:50%;transition:all .2s}
.cart-btn:hover{color:var(--primary);background:rgba(243,244,245,.6)}
.cart-badge{position:absolute;top:-3px;right:-3px;background:var(--primary);color:var(--on-primary);font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1px solid var(--surface)}
.gestion-btn{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--outline-variant);color:var(--on-surface-variant);font-size:14px;font-weight:500;transition:all .2s}
.gestion-btn:hover{background:var(--surface-container-lowest)}
.gestion-icon{display:flex;width:36px;height:36px;align-items:center;justify-content:center;color:var(--on-surface-variant);border-radius:50%;transition:all .2s}
.gestion-icon:hover{color:var(--primary);background:rgba(243,244,245,.6)}

/* ===== Footer ===== */
.footer{background:var(--surface-container-highest);padding:48px 24px;border-top:1px solid rgba(194,201,187,.3);margin-top:64px}
.footer-grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:32px}
.footer-brand{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:700;font-size:16px}
.footer-brand p{font-family:'Poppins'}
.footer-desc{color:var(--on-surface-variant);font-size:12px;line-height:1.6;max-width:300px;margin-top:12px}
.footer h4{color:var(--on-surface);font-weight:600;font-size:14px;margin-bottom:12px}
.footer-info{color:var(--on-surface-variant);font-size:14px}
.footer-info + .footer-info{margin-top:4px}
.cycle-chip{display:inline-block;margin-top:16px;padding:4px 10px;border-radius:6px;background:var(--surface-container);color:var(--on-surface-variant);font-family:'JetBrains Mono';font-size:10px;font-weight:700}
.footer-copy{max-width:1280px;margin:48px auto 0;padding-top:32px;border-top:1px solid rgba(194,201,187,.3);text-align:center;color:var(--on-surface-variant);font-size:12px}

/* ===== Home ===== */
.hero{position:relative;overflow:hidden;padding:48px 0 96px;border-bottom:1px solid rgba(194,201,187,.3)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(21,66,18,.05),transparent 65%);z-index:-1}
.hero-grid{display:grid;grid-template-columns:1fr;gap:48px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(2.25rem,2rem + 3.5vw,3.75rem);letter-spacing:-.02em;color:var(--on-surface)}
.badge-tech{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(201,241,111,.5);color:var(--on-secondary-container);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--secondary);flex-shrink:0}
.hero-copy p{color:var(--on-surface-variant);font-size:1.125rem;line-height:1.7;max-width:32rem}
.hc>*+*{margin-top:20px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--primary);color:var(--on-primary);border-radius:10px;font-weight:700;font-size:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:box-shadow .2s}
.cta:hover{box-shadow:0 6px 16px rgba(21,66,18,.28)}
.img-frame{position:relative;padding:8px;border-radius:16px;transform:rotate(1deg);transition:transform .5s}
.img-frame:hover{transform:rotate(0)}
.img-frame>img{width:100%;height:400px;object-fit:cover;border-radius:12px}
.badge-float{position:absolute;bottom:-24px;left:-8px;display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,.1)}
.badge-float .mi-badge{width:40px;height:40px;border-radius:10px;background:var(--secondary-container);color:var(--on-secondary-container);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge-float .t1{font-size:10px;font-weight:700;color:var(--outline);text-transform:uppercase;letter-spacing:.06em}
.badge-float .t2{font-size:14px;font-weight:700;color:var(--on-surface)}
.section-pad{padding:96px 0}
.section-head h2{font-weight:700;font-size:clamp(1.75rem,1.5rem + 1vw,2.25rem);color:var(--on-surface)}
.section-head p{color:var(--on-surface-variant);margin-top:8px;font-size:16px}

/* ===== Product Cards ===== */
.grid-products{display:grid;grid-template-columns:1fr;gap:32px}
.prod{background:rgba(255,255,255,.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:.5px solid rgba(0,0,0,.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.prod:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(21,66,18,.10)}
.prod-img{height:224px;position:relative;padding:24px;background:var(--surface-container-low);display:flex;align-items:center;justify-content:center}
.prod-img>img{width:100%;height:100%;object-fit:cover;border-radius:10px;mix-blend-mode:multiply;opacity:.9;transition:opacity .3s}
.prod:hover .prod-img>img{opacity:1}
.ph-badge{position:absolute;top:16px;right:16px;background:rgba(248,249,250,.92);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;font-family:'JetBrains Mono';font-size:10px;font-weight:700;color:var(--on-surface);border:1px solid rgba(194,201,187,.3)}
.prod-body{padding:24px;flex:1;display:flex;flex-direction:column}
.prod-cat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.prod-name{font-family:'Poppins';font-weight:700;font-size:1.125rem;color:var(--on-surface);margin-top:4px}
.prod-desc{font-size:14px;color:var(--on-surface-variant);margin-top:8px;flex:1;line-height:1.55}
.prod-foot{margin-top:24px;padding-top:16px;border-top:1px solid rgba(194,201,187,.3);display:flex;justify-content:space-between;align-items:center;gap:12px}
.prod-price{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--on-surface);white-space:nowrap}
.prod-price small{font-size:12px;color:var(--outline);font-family:'Inter';font-weight:400}
.add-btn{width:40px;height:40px;border-radius:50%;background:rgba(21,66,18,.10);color:var(--primary);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .15s;flex-shrink:0}
.add-btn:hover{background:var(--primary);color:var(--on-primary)}
.add-btn:active{transform:scale(.92)}
.add-btn .mi{font-size:20px}
.gestion-btn .mi{font-size:18px}
.login-icon .mi{font-size:32px}
.status-dot .mi{font-size:14px}
.login-main .submit-btn .mi{font-size:20px}

/* ===== Catalog ===== */
.catalog-hero{padding:48px 0 32px;border-bottom:1px solid rgba(194,201,187,.3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chip{padding:8px 16px;border-radius:999px;background:var(--surface-container);color:var(--on-surface-variant);border:1px solid transparent;font-size:13px;font-weight:600;transition:all .2s}
.chip:hover{background:var(--surface-container-high)}
.chip.active{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:700}
.searchbar{margin-top:20px;max-width:440px}
.searchbar .search{position:relative;display:flex;align-items:center}
.searchbar .mi{position:absolute;left:14px;color:var(--outline)}
.searchbar input{width:100%;background:rgba(255,255,255,.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px 16px 12px 44px;font-size:14px;color:var(--on-surface);outline:none;transition:box-shadow .2s}
.searchbar input:focus{box-shadow:0 0 0 2px var(--primary)}
.searchbar input::placeholder{color:var(--outline-variant)}
.empty-state{text-align:center;padding:64px 24px;color:var(--on-surface-variant)}
.empty-state .mi{font-size:44px;color:var(--outline-variant)}

/* ===== Investigation ===== */
.inv-hero{padding:48px 0 96px;border-bottom:1px solid rgba(194,201,187,.3)}
.inv-hero p{color:var(--on-surface-variant);font-size:1.0625rem;line-height:1.7;max-width:44rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;max-width:640px}
.stat .stat-n{font-family:'Poppins';font-weight:800;font-size:clamp(1.75rem,1.5rem + 1.5vw,2.5rem);color:var(--on-surface)}
.stat .stat-n.acc{color:var(--primary)}
.stat .stat-l{font-size:11px;color:var(--on-surface-variant);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bento figure{overflow:hidden;border-radius:16px;position:relative}
.bento figcaption{position:absolute;inset:auto 0 0 0;padding:24px 16px 12px;background:linear-gradient(to top,rgba(0,0,0,.45),transparent);color:#fff;font-size:12px;font-weight:600}
.bento img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.bento figure:hover img{transform:scale(1.05)}
.bento .b-h-1,.bento .b-h-4{aspect-ratio:4/3.2}
.bento .b-h-2,.bento .b-h-3{aspect-ratio:4/2.8}
.feat-card{background:rgba(255,255,255,.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:.5px solid rgba(0,0,0,.08);border-radius:16px;padding:28px}
.feat-card .mi-box{width:44px;height:44px;border-radius:12px;background:var(--secondary-container);color:var(--on-secondary-container);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.feat-card h3{font-weight:700;font-size:1.125rem;color:var(--on-surface)}
.feat-card p{font-size:14px;color:var(--on-surface-variant);margin-top:8px;line-height:1.6}

/* ===== Cart ===== */
.cart-layout{max-width:1080px;margin:48px auto 96px;padding:0 24px;display:grid;grid-template-columns:1fr;gap:32px;align-items:start}
.cart-row{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;margin-bottom:16px}
.cart-row img{width:88px;height:88px;object-fit:cover;border-radius:10px;flex-shrink:0}
.cart-row .c-name{font-weight:700;font-size:15px}
.cart-row .c-cat{font-size:11px;color:var(--outline);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--surface-container);color:var(--on-surface);display:flex;align-items:center;justify-content:center;transition:background .2s}
.qty button:hover{background:var(--surface-container-high)}
.qty .q{min-width:22px;text-align:center;font-weight:700;font-family:'JetBrains Mono';font-size:14px}
.c-line{font-family:'JetBrains Mono';font-weight:700;font-size:15px;margin-left:auto;white-space:nowrap}
.c-line small{font-family:'Inter';color:var(--outline);font-weight:400}
.c-remove{color:var(--on-surface-variant);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.c-remove:hover{color:var(--error);background:rgba(186,26,26,.06)}
.cart-summary{padding:24px;border-radius:16px}
.cart-summary h3{font-weight:700;font-size:1.25rem;margin-bottom:20px}
.sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--on-surface-variant);margin-bottom:10px}
.sum-row.total{border-top:1px solid rgba(194,201,187,.3);margin-top:16px;padding-top:16px;color:var(--on-surface);font-size:18px;font-weight:700;font-family:'JetBrains Mono'}
.sum-row.total small{font-family:'Inter';font-size:12px;color:var(--outline);font-weight:400}
.checkout-btn{width:100%;margin-top:20px;padding:14px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.checkout-btn:hover{opacity:.9}

/* ===== Login ===== */
.login-wrap{min-height:100vh;position:relative;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.login-blob{position:absolute;z-index:0;pointer-events:none;border-radius:50%;filter:blur(100px)}
.blob-1{top:25%;left:25%;width:384px;height:384px;background:rgba(21,66,18,.12)}
.blob-2{bottom:30%;right:22%;width:500px;height:500px;background:rgba(76,103,0,.08)}
.login-back{position:absolute;top:24px;left:24px;z-index:20;display:flex;align-items:center;gap:8px;color:var(--on-surface-variant);font-weight:700;font-size:14px;transition:color .2s}
.login-back:hover{color:var(--primary)}
.login-main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px;position:relative;z-index:10}
.login-card{position:relative;width:100%;max-width:28rem;padding:32px 28px;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);border:.5px solid rgba(194,201,187,.4)}
.login-card .accent{position:absolute;top:0;left:0;width:100%;height:4px;background:var(--primary)}
.login-head{text-align:center;margin-bottom:40px}
.login-icon{width:64px;height:64px;margin:0 auto 24px;background:rgba(237,238,239,.5);border:.5px solid rgba(194,201,187,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.login-head h1{font-size:1.5rem;font-weight:700;color:var(--primary);margin-bottom:8px}
.login-head p{font-size:14px;color:var(--on-surface-variant)}
.field{position:relative;margin-bottom:24px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--outline);margin-bottom:4px;transition:color .2s}
.field .line{position:relative;display:flex;align-items:center}
.field .line .mi{position:absolute;left:0;color:var(--outline-variant);pointer-events:none;transition:color .2s}
.field input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(194,201,187,.5);padding:8px 32px;color:var(--on-surface);font-size:16px;outline:none;border-radius:0;transition:border-color .2s}
.field input::placeholder{color:var(--outline-variant)}
.field input:focus{border-bottom-color:var(--primary)}
.field:focus-within label{color:var(--primary)}
.field:focus-within .mi{color:var(--primary)}
.submit-btn{width:100%;background:var(--primary);color:var(--on-primary);font-weight:700;padding:14px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;transition:background .2s,opacity .2s}
.submit-btn:hover{background:var(--primary-container)}
.submit-btn:disabled{opacity:.7;cursor:wait}
.login-secure{border-top:1px solid rgba(194,201,187,.2);margin-top:32px;padding-top:24px;text-align:center}
.login-secure p{font-size:11px;color:var(--outline);display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== Admin ===== */
.admin-shell{min-height:100vh;display:flex;background:var(--background)}
.sidebar{display:none;width:256px;flex-direction:column;position:fixed;left:0;top:0;height:100%;background:var(--surface-container-lowest);border-right:1px solid rgba(194,201,187,.2);padding:16px;z-index:40}
.side-brand{padding:0 8px;margin-bottom:32px}
.side-brand h1{font-size:1.25rem;font-weight:700;color:var(--primary);letter-spacing:-.01em}
.side-brand p{font-size:12px;font-weight:500;color:var(--on-surface-variant)}
.side-nav{flex:1;display:flex;flex-direction:column;gap:8px}
.side-btn{position:relative;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:12px;padding:12px;color:var(--on-surface-variant);transition:all .18s}
.side-btn .mi{font-size:22px}
.side-btn:hover{background:var(--surface-container-high);color:var(--on-surface)}
.side-btn.active{background:var(--secondary-container);color:var(--on-secondary-container)}

    chips += '<button class="chip' + (STATE.cat === c ? ' active' : '') + '" data-cat="' + c + '" onclick="setCat(this.getAttribute(\'data-cat\'))">' + c + '</button>';
  });
  return '<div class="animate-in">' +
    '<section class="catalog-hero">' +
      '<div class="container">' +
        '<span class="badge-tech"><span class="badge-dot pulse"></span>Catálogo Escolar</span>' +
        '<h1 style="font-size:clamp(1.9rem,1.6rem+1.6vw,2.75rem);font-weight:700;margin-top:16px">Catálogo de Productos</h1>' +
        '<p style="color:var(--on-surface-variant);margin-top:10px;max-width:36rem">Formulaciones desarrolladas por los alumnos de 7.° año de Química, listas para encargarse por lote escolar.</p>' +
        '<div class="searchbar"><div class="search">' + mi('search') + '<input id="cat-search" type="text" placeholder="Buscar por nombre, categoría o descripción…" oninput="applyFilters()" value="' + STATE.query + '"></div></div>' +
        '<div class="chips">' + chips + '</div>' +
      '</div>' +
    '</section>' +
    '<section class="container section-pad" style="padding-top:48px">' +
      '<div class="grid-products" id="cat-grid"></div>' +
    '</section>' +
  '</div>';
}

function catalogFiltered() {
  var q = (STATE.query || '').toLowerCase();
  return PRODUCTS.filter(function (p) {
    var okCat = STATE.cat === 'all' || p.category === STATE.cat;
    var okQ = !q || p.name.toLowerCase().indexOf(q) > -1 || p.category.toLowerCase().indexOf(q) > -1 || p.description.toLowerCase().indexOf(q) > -1;
    return okCat && okQ;
  });
}

function applyFilters() {
  var inp = document.getElementById('cat-search');
  if (inp) STATE.query = inp.value;
  document.querySelectorAll('.chips .chip').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-cat') === STATE.cat);
  });
  var grid = document.getElementById('cat-grid');
  if (!grid) return;
  var list = catalogFiltered();
  grid.innerHTML = list.length
    ? list.map(productCard).join('')
    : '<div class="empty-state">' + mi('search_off') + '<h3 style="margin-top:12px">Sin resultados</h3><p style="margin-top:6px">Probá con otro término o categoría.</p></div>';
}

function setCat(c) {
  STATE.cat = c;
  applyFilters();
}

/* ============ CART ============ */
function cartHTML() {
  var items = PRODUCTS.filter(function (p) { return (CART[p.id] || 0) > 0; });
  var total = items.reduce(function (acc, p) { return acc + (CART[p.id] || 0) * p.price; }, 0);

  if (!items.length) {
    return '<div class="cart-layout" style="grid-template-columns:1fr"><div class="empty-state glass-panel" style="border-radius:16px;padding:72px 24px">' +
      mi('remove_shopping_cart', false, '') +
      '<h3 style="margin-top:16px;font-family:Poppins">Tu carrito está vacío</h3>' +
      '<p style="margin-top:8px">Explorá el catálogo y sumá productos de los lotes escolares.</p>' +
      '<div style="margin-top:24px"><button class="cta" onclick="go(\'catalog\')">Ir al catálogo</button></div>' +
    '</div></div>';
  }

  var rows = items.map(function (p) {
    return '<div class="cart-row glass-panel">' +
      '<img src="' + p.image + '" alt="' + p.name + '">' +
      '<div style="min-width:0;flex:1">' +
        '<p class="c-cat">' + p.category + '</p>' +
        '<p class="c-name">' + p.name + '</p>' +
        '<div class="qty">' +
          '<button onclick="changeQty(\'' + p.id + '\',-1)" aria-label="Restar">' + mi('remove') + '</button>' +
          '<span class="q">' + CART[p.id] + '</span>' +
          '<button onclick="changeQty(\'' + p.id + '\',1)" aria-label="Sumar">' + mi('add') + '</button>' +
        '</div>' +
      '</div>' +
      '<span class="c-line">' + money(CART[p.id] * p.price) + ' <small>ARS</small></span>' +
      '<button class="c-remove" onclick="changeQty(\'' + p.id + '\',-9999)" aria-label="Quitar ' + p.name + '">' + mi('delete') + '</button>' +
    '</div>';
  }).join('');

  return '<div class="cart-layout">' +
    '<div class="animate-in">' +
      '<span class="badge-tech"><span class="badge-dot pulse"></span>Pedido Escolar</span>' +
      '<h1 style="font-size:clamp(1.9rem,1.6rem+1.6vw,2.75rem);font-weight:700;margin:16px 0 24px">Tu carrito</h1>' +
      '<div>' + rows + '</div>' +
    '</div>' +
    '<aside class="cart-summary glass-panel animate-in">' +
      '<h3>Resumen del pedido</h3>' +
      '<div class="sum-row"><span>Productos</span><span>' + items.length + '</span></div>' +
      '<div class="sum-row"><span>Unidades</span><span>' + cartCount() + '</span></div>' +
      '<div class="sum-row total"><span>Total</span><span>' + money(total) + ' <small>ARS</small></span></div>' +
      '<button class="checkout-btn" onclick="checkout()">' + mi('lock_open') + '<span>Iniciar Checkout</span></button>' +
      '<p style="font-size:11px;color:var(--outline);margin-top:14px;text-align:center">El pago se realiza por transferencia al alias institucional.</p>' +
    '</aside>' +
  '</div>';
}

function changeQty(id, delta) {
  CART[id] = (CART[id] || 0) + delta;
  if (CART[id] < 0) CART[id] = 0;
  paint();
  var b = document.getElementById('cart-badge');
  if (b) b.textContent = cartCount();
}

  if (type.indexOf('Líquido') > -1) return 'L';

/* ============ RENDERER ============ */
function renderView() {
  switch (STATE.view) {
    case 'catalog': return shell('catalog', catalogHTML());
    case 'investigation': return shell('investigation', investigationHTML());
    case 'cart': return shell('cart', cartHTML());
    case 'login': return loginHTML();
    case 'admin-orders': return adminShell('admin-orders', adminOrdersHTML());
    case 'admin-stock': return adminShell('admin-stock', adminStockHTML());
    default: return shell('home', homeHTML());
  }
}

function paint() {
  document.getElementById('app').innerHTML = renderView();
  if (STATE.view === 'catalog') {
    var inp = document.getElementById('cat-search');
    if (inp) inp.value = STATE.query;
    applyFilters();
  }
}

paint();
